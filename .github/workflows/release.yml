name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FolderWatch.sln

      - name: Build
        run: dotnet build FolderWatch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FolderWatch.sln --configuration Release --no-build

      - name: Package release ZIP
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "FolderWatch-$version-win-x64.zip"

          ./scripts/package.ps1 -Tag $version -OutputDirectory artifacts/rc
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Attest release ZIP provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/rc/*.zip'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "artifacts/rc/${{ steps.package.outputs.zip_name }}"
          "artifacts/rc/${{ steps.package.outputs.zip_name }}.sha256"
          --verify-tag --title "FolderWatch ${{ github.ref_name }}"
          --notes-file "docs/release-notes-${{ github.ref_name }}.md"
