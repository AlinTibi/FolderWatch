name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FolderWatch.sln

      - name: Build
        run: dotnet build FolderWatch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FolderWatch.sln --configuration Release --no-build

      - name: Package release ZIP
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "FolderWatch-$version-win-x64.zip"

          ./scripts/package.ps1 -Tag $version -OutputDirectory artifacts/rc
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "artifacts/rc/${{ steps.package.outputs.zip_name }}"
          "artifacts/rc/${{ steps.package.outputs.zip_name }}.sha256"
          --title "FolderWatch ${{ github.ref_name }}"
          --generate-notes
