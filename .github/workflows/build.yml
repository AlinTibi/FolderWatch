name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FolderWatch.sln

      - name: Build
        run: dotnet build FolderWatch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FolderWatch.sln --configuration Release --no-build

      - name: Validate portable packaging
        shell: pwsh
        run: ./scripts/package.ps1 -Tag v1.1.1
