name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FolderWatch.sln

      - name: Build
        run: dotnet build FolderWatch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FolderWatch.sln --configuration Release --no-build

      - name: Validate portable packaging
        shell: pwsh
        run: ./scripts/package.ps1 -Tag v1.1.1
