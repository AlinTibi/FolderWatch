version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      nuget-updates:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions-updates:
        patterns: ["*"]
